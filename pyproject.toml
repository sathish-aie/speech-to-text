[tool.poetry]
name = "stt"
version = "1.0.1"
description = "A Speech-to-Text server using FastAPI, LiteLLM, and FFmpeg"
authors = ["Sathish"]
readme = "README.md"
packages = [{include = "."}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
openai = "^1.12.0"
groq = "^0.4.0"
litellm = "^1.30.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
fastapi-mcp = "^0.1.0"
ffmpeg-python = "^0.2.0"

[tool.poetry.scripts]
stt-server = "main:start_server"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
